name: Gateway prototype checks

on:
  push:
    branches:
      - feat/remote-gateway
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Gateway tests
        run: bun test ./tests/gateway.test.ts
      - name: Existing test suite
        run: bun test ./tests
      - name: Prepare example environment for Compose validation
        run: cp .env.gateway.example .env
      - name: Validate Compose syntax
        run: docker compose -f docker-compose.gateway.yml config --quiet
      - name: Build Gateway container
        run: docker build -f Dockerfile.gateway -t codex-chatgpt-web-gateway:ci .
