name: Gateway prototype checks

on:
  push:
    branches:
      - feat/remote-gateway
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Gateway tests
        run: bun test ./tests/gateway.test.ts
      - name: Prepare example environment for Compose validation
        run: cp .env.gateway.example .env
      - name: Validate Compose syntax
        run: docker compose -f docker-compose.gateway.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/code1379/codex-chatgpt-web-gateway:gateway-latest
            ghcr.io/code1379/codex-chatgpt-web-gateway:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
