services:
  chatgpt-web-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: chatgpt-web-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CODEX_CHATGPT_WEB_HOME: /data
      GATEWAY_CHROMIUM_PATH: /usr/bin/chromium
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 17840
      GATEWAY_INTERNAL_PORT: 17841
      GATEWAY_TLS_CERT_FILE: ${GATEWAY_TLS_CERT_FILE:-/certs/fullchain.pem}
      GATEWAY_TLS_KEY_FILE: ${GATEWAY_TLS_KEY_FILE:-/certs/privkey.pem}
    ports:
      - "${GATEWAY_BIND_IP:-0.0.0.0}:17840:17840"
    volumes:
      - gateway-data:/data
      - ${GATEWAY_CERT_DIR:-./certs}:/certs:ro
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: false
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('https://127.0.0.1:17840/healthz',{tls:{rejectUnauthorized:false}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  gateway-data:
